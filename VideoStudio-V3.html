<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Recovery</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Hind+Madurai:wght@400;500;600&family=Noto+Sans+Tamil:wght@400;500;600&family=Inter:wght@400;500;600&family=Playfair+Display:wght@700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=side_navigation" />



    <style>
        /* --- 1. DESIGN SYSTEM & RESET --- */
        :root {
            --primaryColor: #2596be;
            --secondaryColor: #5bc1da;
            --tertiaryColor: #666666;
            --quaternaryColor: #ebeaea;
            --darkColor: #000000;
            --lightColor: #ffffff;
            --customColor: #0a78c1;
            --shadowPrimary: 0 4px 8px rgba(20, 71, 108, 0.15);

            --fontHeading: 'Playfair Display', serif;
            --fontBody: 'Inter', sans-serif;
            --fontCustom: 'Bebas Neue', sans-serif;
            --fontTamil: 'Noto Sans Tamil', sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        html {
            font-size: 62.5%;
            /* 1rem = 10px */
        }

        body {
            margin: 0;
            padding: 0;
            font-family: var(--fontBody);
            background-color: #f1f5f9;
            color: var(--darkColor);
            font-size: 1.3rem;
        }

        /* h1 {
            margin: 0;
            font-family: var(--fontCustom);
            font-family: var(--fontHeading);
            color: var(--customColor);
            color: chartreuse;
            font-weight: 400;
            letter-spacing: 0.05em;
        } */

        h2,
        h3 {
            margin: 0;
            font-family: var(--fontHeading);
        }

        @property --sidebar-width {
            syntax: '<length>';
            inherits: true;
            initial-value: 240px;
        }

        /* --- 2. LAYOUT ARCHITECTURE --- */
        .main-container {
            --sidebar-width: 240px;
            display: grid;
            grid-template-columns: var(--sidebar-width) 1fr;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            height: 100vh;
            background: var(--lightColor);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: --sidebar-width 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                grid-template-columns 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* --- 3. SIDEBAR --- */
        .sidebar {
            width: 100%;
            min-width: 0;
            background-color: var(--primaryColor);
            color: var(--lightColor);
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            transition: padding 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            box-sizing: border-box;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 1rem;
            min-height: 4.2rem;
            overflow: hidden;
        }

        .sidebar-header h2 {
            font-size: 2.4rem;
            letter-spacing: 1px;
            margin: 0;
            white-space: nowrap;
        }

        .sidebar-logo {
            max-height: 3.2rem;
            max-width: 140px;
            object-fit: contain;
            opacity: 1;
            transform: scale(1);
            transition: opacity 0.2s ease, max-width 0.35s cubic-bezier(0.4, 0, 0.2, 1), transform 0.2s ease;
            transform-origin: left center;
        }

        .material-symbols-outlined {
            font-variation-settings:
                'FILL' 0,
                'wght' 400,
                'GRAD' 0,
                'opsz' 24
        }

        .toggle-btn {
            width: 3rem;
            height: 3rem;
            cursor: pointer;
            padding: 0.4rem;
            border-radius: 6px;
            color: var(--lightColor);
            transition: background 0.2s, transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 2.4rem;
            user-select: none;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .toggle-btn:focus-visible {
            outline: 2px solid var(--lightColor);
            outline-offset: 2px;
        }

        .toggle-btn:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        .sidebar-main {
            flex: 1;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            overflow-y: auto;
            min-height: 0;
        }

        .sidebar-footer {
            margin-top: auto;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            padding-top: 1rem;
            background-color: transparent;
            color: var(--lightColor);
        }

        .nav-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .nav-list li {
            padding: 0;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s, padding 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 500;
            font-size: 1.3rem;
            white-space: nowrap;
            overflow: hidden;
        }

        .nav-list li a.nav-link {
            color: var(--lightColor);
            text-decoration: none;
            display: flex;
            align-items: center;
            width: 100%;
            padding: 1.2rem 1.4rem;
            transition: padding 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            box-sizing: border-box;
        }

        .nav-list li i {
            margin-right: 1.2rem;
            font-size: 1.6rem;
            width: 2rem;
            text-align: center;
            flex-shrink: 0;
            transition: margin-right 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-text {
            display: inline-block;
            white-space: nowrap;
            opacity: 1;
            max-width: 160px;
            overflow: hidden;
            transition: opacity 0.2s ease, max-width 0.35s cubic-bezier(0.4, 0, 0.2, 1), transform 0.2s ease;
        }

        .nav-list li:hover {
            background-color: rgba(255, 255, 255, 0.22);
        }

        .nav-list li.active {
            background-color: rgba(255, 255, 255, 0.28);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
        }

        .nav-list li.active a.nav-link {
            font-weight: 600;
        }

        .nav-list li.tamil {
            font-family: var(--fontTamil);
        }

        /* Collapsed Sidebar Styles */
        .main-container.collapsed {
            --sidebar-width: 70px;
            grid-template-columns: 70px 1fr;
        }

        .main-container.collapsed .sidebar {
            width: 100%;
            min-width: 0;
            padding: 2rem 1rem;
        }

        .main-container.collapsed .sidebar-header {
            justify-content: center;
        }

        .main-container.collapsed .sidebar-header h2,
        .main-container.collapsed .sidebar-header .sidebar-logo {
            opacity: 0;
            max-width: 0;
            margin: 0;
            padding: 0;
            pointer-events: none;
            transform: scale(0.85);
        }

        .main-container.collapsed .toggle-btn {
            transform: rotate(180deg);
        }

        .main-container.collapsed .nav-list li a.nav-link {
            justify-content: center;
            padding: 1.2rem 0;
        }

        .main-container.collapsed .nav-list li i {
            margin-right: 0;
        }

        .main-container.collapsed .nav-list li .nav-text {
            opacity: 0;
            max-width: 0;
            transform: translateX(-10px);
            pointer-events: none;
        }

        /* --- 4. CONTENT AREA --- */
        .content-area {
            min-width: 0;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            background-color: #f1f5f9;
        }

        header.top-header {
            background-color: var(--lightColor);
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--quaternaryColor);
        }

        header.top-header h1 {
            font-size: 2.2rem;
            color: var(--primaryColor);
            /* color: var(--customColor); */
            flex-grow: 1;
            margin-left: 1.5rem;
            font-family: var(--fontHeading);
        }

        header.top-header img {
            max-height: 40px;
            object-fit: contain;
        }

        header.top-header .app-logo {
            flex-shrink: 0;
            display: block;
        }

        .logo-placeholder {
            display: flex;
            align-items: center;
        }

        main {
            padding: 0;
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
        }

        #contentFrame {
            width: 100%;
            height: 100%;
            min-height: 70vh;
            border: none;
            display: block;
            flex: 1;
            background: #ffffff;
        }




        .tamil-text {
            font-family: var(--fontTamil);
            font-size: 1.1em;
        }

        footer {
            background-color: var(--darkColor);
            color: var(--lightColor);
            padding: 1rem 0 1rem;
            margin-top: auto;
        }

        .footer-content {
            text-align: center;
        }

        p.copyright {
            margin: 1rem 0;
            font-family: var(--fontBody);
            font-size: 1.2rem;
            opacity: 0.8;
            color: var(--lightColor);
        }

        .social-links {
            margin-top: 1.5rem;
        }

        .social-links a {
            display: inline-block;
            margin: 0 1rem;
            color: #7f888b;
            text-decoration: none;
            font-weight: bold;
            opacity: 0.7;
            font-size: 1.2rem;
            transition: opacity 0.2s;
            font-family: var(--fontBody);
        }

        .social-links a i {
            color: #2596be;
        }

        .social-links a:hover {
            opacity: 1;
            text-decoration: underline;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #aaa;
        }
    </style>
</head>

<body>

    <div class="main-container">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <!-- Sidebar Header -->
            <header class="sidebar-header">
                <img src="https://i.ibb.co/1GFKDLFf/logo-jiametric.png" alt="logo-jiametric" class="sidebar-logo" border="0" />
                <span id="sidebarToggle" class="material-symbols-outlined toggle-btn" title="Toggle Sidebar"
                    role="button" tabindex="0" aria-label="Toggle sidebar" aria-expanded="true">side_navigation</span>
            </header>

            <!-- Sidebar Main -->
            <main class="sidebar-main">
                <ul class="nav-list">
                    <li title="Dashboard" id="nav-dashboard">
                        <a href="javascript:void(0);" class="nav-link" id="link-dashboard">
                            <i class="fa-solid fa-gauge fa-fw"></i>
                            <span class="nav-text">Dashboard</span>
                        </a>
                    </li>
                    <li title="App-Review-V1" id="nav-app-review-v1"
                        onclick="loadReview(this, 'VideoStudio-V3 Architecture Review-Before.html');">
                        <a href="javascript:void(0);" class="nav-link" id="link-app-review-v1">
                            <i class="fa-solid fa-clipboard-list fa-fw"></i>
                            <span class="nav-text">App-Review-V1</span>
                        </a>
                    </li>
                    <li title="App-Review-V2" id="nav-app-review-v2"
                        onclick="loadReview(this, 'VideoStudio-V3 Architecture Review-After.html');">
                        <a href="javascript:void(0);" class="nav-link" id="link-app-review-v2">
                            <i class="fa-solid fa-clipboard-check fa-fw"></i>
                            <span class="nav-text">App-Review-V2</span>
                        </a>
                    </li>
                    <li title="App-Review-V3" id="nav-app-review-v3"
                        onclick="loadReview(this, 'VideoStudio-V3 Architecture Review-Perfect.html');">
                        <a href="javascript:void(0);" class="nav-link" id="link-app-review-v3">
                            <i class="fa-solid fa-award fa-fw"></i>
                            <span class="nav-text">App-Review-V3</span>
                        </a>
                    </li>
                    <li title="Make App Rating 5/5" id="nav-app-rating-5"
                        onclick="loadReview(this, 'VideoStudio-V3 Make App Rating 5 of 5.html');">
                        <a href="javascript:void(0);" class="nav-link" id="link-app-rating-5">
                            <i class="fa-solid fa-ranking-star fa-fw"></i>
                            <span class="nav-text">Make App Rating 5/5</span>
                        </a>
                    </li>
                </ul>
            </main>

            <!-- Sidebar Footer -->
            <footer class="sidebar-footer">
                <ul class="nav-list">
                    <li title="Settings" id="nav-settings">
                        <a href="javascript:void(0);" class="nav-link" id="link-settings">
                            <i class="fa-solid fa-gear fa-fw"></i>
                            <span class="nav-text">Settings</span>
                        </a>
                    </li>
                </ul>
            </footer>
        </aside>

        <!-- CONTENT -->
        <div class="content-area">
            <header class="top-header">
                <!-- Data Recovery logo: a disc inside a recovery arrow -->
                <svg class="app-logo" width="40" height="40" viewBox="0 0 48 48" role="img"
                    aria-label="Data Recovery logo">
                    <circle cx="24" cy="24" r="23" fill="#2596be" />
                    <path d="M24 7 A17 17 0 1 1 8.03 18.19" fill="none" stroke="#5bc1da" stroke-width="3"
                        stroke-linecap="round" />
                    <polygon points="9.06,15.37 10.64,21.27 4.06,18.87" fill="#5bc1da" />
                    <circle cx="24" cy="24" r="9.5" fill="none" stroke="#ffffff" stroke-width="2.5" />
                    <circle cx="24" cy="24" r="2.6" fill="#ffffff" />
                </svg>
                <h1>Data Recovery</h1>
                <div class="logo-placeholder"><img src="https://i.ibb.co/1GFKDLFf/logo-jiametric.png" alt="logo-jiametric" border="0" /></div>
            </header>

            <main>
                <iframe id="contentFrame" src=""
                    style="width: 100%; height: 100%; min-height: 70vh; border: none; flex: 1;"></iframe>
            </main>

            <footer>
                <div class="footer-content">
                    <p class="copyright">© 2026 JIAMETRIC Technologies. All rights reserved.</p>
                    <div class="social-links">
                        <a href="https://twitter.com" target="_blank"><i class="fab fa-twitter"></i> Twitter</a>
                        <a href="https://linkedin.com" target="_blank"><i class="fab fa-linkedin"></i> LinkedIn</a>
                        <a href="https://youtube.com" target="_blank"><i class="fab fa-youtube"></i> YouTube</a>
                        <a href="https://instagram.com" target="_blank"><i class="fab fa-instagram"></i> Instagram</a>
                        <a href="https://facebook.com" target="_blank"><i class="fab fa-facebook"></i> Facebook</a>
                    </div>
                </div>
            </footer>
        </div>
    </div>



    <script>
        const sidebarToggle = document.getElementById('sidebarToggle');
        const mainContainer = document.querySelector('.main-container');

        function toggleSidebar() {
            const collapsed = mainContainer.classList.toggle('collapsed');
            sidebarToggle.setAttribute('aria-expanded', String(!collapsed));
        }

        if (sidebarToggle && mainContainer) {
            sidebarToggle.addEventListener('click', toggleSidebar);
            sidebarToggle.addEventListener('keydown', event => {
                if (event.key === 'Enter' || event.key === ' ') {
                    event.preventDefault();
                    toggleSidebar();
                }
            });
        }

        // Open a review page in the content frame and mark its sidebar item active.
        function loadReview(item, file) {
            const frame = document.getElementById('contentFrame');
            if (frame) {
                frame.src = encodeURI(file);
            }
            document.querySelectorAll('.nav-list li.active').forEach(li => li.classList.remove('active'));
            item.classList.add('active');
            const heading = document.querySelector('header.top-header h1');
            if (heading) {
                heading.textContent = item.title;
            }
        }

        // Dashboard shows the Data Recovery hero and is the view the page opens on.
        // Wired here so the Dashboard item's markup stays exactly as it was.
        const dashboardItem = document.getElementById('nav-dashboard');

        function showDashboard() {
            loadReview(dashboardItem, 'DataRecovery.html');
            const heading = document.querySelector('header.top-header h1');
            if (heading) {
                heading.textContent = 'Data Recovery';
            }
        }

        if (dashboardItem) {
            dashboardItem.addEventListener('click', showDashboard);
            showDashboard();
        }
    </script>
</body>

</html>
